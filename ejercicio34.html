<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambio de Divisas</title>
    <style>
        /* Estilo visual consistente con tus otros ejercicios */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #2c3e50; margin-bottom: 25px; }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #2980b9; }
        #resultado {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            padding: 15px;
            border-radius: 5px;
            background-color: #e8f4fd;
            color: #2c3e50;
            border-left: 5px solid #3498db;
            display: none;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Cambio de Divisas</h2>
    
    <div class="input-group">
        <label>Cantidad:</label>
        <input type="number" id="cantidad" step="0.01" placeholder="Ej: 100">
    </div>
    
    <div class="input-group">
        <label>Tipo de cambio (Tasa):</label>
        <input type="number" id="tasa" step="0.01" placeholder="Ej: 0.85">
    </div>
    
    <button onclick="calcularCambio()">Calcular</button>
    
    <div id="resultado"></div>
</div>

<script>
    function calcularCambio() {
        // 1. Obtener los valores del formulario
        const cantidad = parseFloat(document.getElementById("cantidad").value);
        const tasa = parseFloat(document.getElementById("tasa").value);
        const resDiv = document.getElementById("resultado");

        // 2. Validar que sean números válidos
        if (isNaN(cantidad) || isNaN(tasa)) {
            resDiv.style.display = "block";
            resDiv.innerText = "Por favor, completa ambos campos.";
            return;
        }

        // 3. Realizar el cálculo
        let multiplicacion = cantidad * tasa;

        // 4. Formatear con dos decimales usando .toFixed(2)
        let resultadoFinal = multiplicacion.toFixed(2);

        // 5. Mostrar el mensaje exacto pedido
        resDiv.style.display = "block";
        resDiv.innerText = "El resultado es " + resultadoFinal;
    }
</script>

</body>
</html>
